; TinyOTA example for ESP32 (Arduino framework).
; Pick your board; any ESP32 / C3 / S3 board with 4 MB flash works.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Two OTA app slots (app0/app1). The default partition table also has two,
; this one just gives each slot more room (1.9 MB).
board_build.partitions = min_spiffs.csv
lib_deps =
    bblanchon/ArduinoJson@^7

[env:esp32-c3]
extends = env:esp32dev
board = esp32-c3-devkitm-1

[env:esp32-s3]
extends = env:esp32dev
board = esp32-s3-devkitc-1
